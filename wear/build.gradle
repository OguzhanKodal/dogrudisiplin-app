// Wear OS saat uygulaması. Telefon uygulamasıyla aynı applicationId ve imza: Data Layer ancak böyle eşleşir.
// Expo prebuild bu modülü android/settings.gradle'a ekler (plugins/wear-os.js).
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    namespace "com.kodal.dogrudisiplin.saat"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.kodal.dogrudisiplin"
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Telefon APK'sıyla aynı Play kaydında yayınlanır: sürüm kodu ayrı aralıkta.
        versionCode 100001
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            // Yayın imzası telefon uygulamasıyla aynı anahtar olmalı (EAS / Play App Signing).
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}

dependencies {
    implementation "androidx.wear.compose:compose-material3:1.7.2"
    implementation "androidx.wear.compose:compose-foundation:1.7.2"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.wear.tiles:tiles:1.6.2"
    implementation "androidx.wear.protolayout:protolayout:1.4.2"
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0"
    implementation "androidx.concurrent:concurrent-futures:1.3.0"
    implementation "com.google.android.gms:play-services-wearable:20.0.1"
}
